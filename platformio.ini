; Countdown Clock for the ESP32-2432S028R ("Cheap Yellow Display")
;
; Build:   pio run -e cyd
; Upload:  pio run -e cyd -t upload
; Monitor: pio device monitor
;
; Most CYDs (single micro-USB) use the ILI9341 env "cyd".
; If yours has BOTH micro-USB and USB-C and the picture looks wrong even after
; toggling "Invert colors" in the web settings, try env "cyd2usb" (ST7789).

[platformio]
default_envs = cyd

[common]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = partitions.csv   ; two app slots for wireless updates
board_build.filesystem = littlefs
extra_scripts = post:scripts/versioned_bin.py   ; also saves firmware/countdown-clock-<board>-v<version>.bin
lib_deps =
  bodmer/TFT_eSPI@^2.5.43
  bodmer/TJpg_Decoder@^1.1.0
  tzapu/WiFiManager@^2.0.17
  bblanchon/ArduinoJson@^7.2.0
build_flags =
  -DUSER_SETUP_LOADED=1
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=320
  -DUSE_HSPI_PORT=1
  -DTFT_MISO=12
  -DTFT_MOSI=13
  -DTFT_SCLK=14
  -DTFT_CS=15
  -DTFT_DC=2
  -DTFT_RST=-1
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DLOAD_FONT4=1
  -DLOAD_FONT6=1
  -DLOAD_FONT7=1
  -DLOAD_FONT8=1
  -DLOAD_GFXFF=1
  -DSMOOTH_FONT=1
  -DSPI_FREQUENCY=55000000
  -DSPI_READ_FREQUENCY=20000000
  -DCORE_DEBUG_LEVEL=0
  -DDISABLE_ALL_LIBRARY_WARNINGS=1

[env:cyd]
extends = common
build_flags =
  ${common.build_flags}
  -DILI9341_2_DRIVER=1

[env:cyd2usb]
extends = common
build_flags =
  ${common.build_flags}
  -DST7789_DRIVER=1
